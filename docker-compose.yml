version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace
    working_dir: /workspace
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=development
      - PORT=5000
    # Keep container running and allow manual start
    command: tail -f /dev/null
    # Alternative: Auto-start Flask app
    # command: python app.py
    networks:
      - default

